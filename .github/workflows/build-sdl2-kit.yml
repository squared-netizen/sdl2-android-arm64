name: Build SDL2 Android ARM64 Kit

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-sdl2-kit.yml
      - tests/**

permissions:
  contents: read

env:
  SDL_VERSION: 2.32.10
  SDL_REF: release-2.32.10
  TTF_VERSION: 2.24.0
  TTF_REF: release-2.24.0
  MIXER_VERSION: 2.8.2
  MIXER_REF: release-2.8.2
  IMAGE_VERSION: 2.8.12
  IMAGE_REF: release-2.8.12
  NET_VERSION: 2.4.0
  NET_REF: release-2.4.0
  NDK_VERSION: 27.0.12077973
  ANDROID_ABI: arm64-v8a
  ANDROID_API: 30
  OUTPUT_NAME: SDL2-2.32.10-TTF-2.24.0-MIXER-2.8.2-IMAGE-2.8.12-NET-2.4.0-android-arm64

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out builder
        uses: actions/checkout@v5

      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.0.12077973"

      - name: Fetch pinned SDL2 sources
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch "${SDL_REF}" \
            --depth 1 \
            https://github.com/libsdl-org/SDL.git \
            SDL

          git clone \
            --branch "${TTF_REF}" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/libsdl-org/SDL_ttf.git \
            SDL_ttf

          git clone \
            --branch "${MIXER_REF}" \
            --depth 1 \
            https://github.com/libsdl-org/SDL_mixer.git \
            SDL_mixer

          git clone \
            --branch "${IMAGE_REF}" \
            --depth 1 \
            https://github.com/libsdl-org/SDL_image.git \
            SDL_image

          git clone \
            --branch "${NET_REF}" \
            --depth 1 \
            https://github.com/libsdl-org/SDL_net.git \
            SDL_net

          test "$(git -C SDL describe --tags --exact-match)" = "${SDL_REF}"
          test "$(git -C SDL_ttf describe --tags --exact-match)" = "${TTF_REF}"
          test "$(git -C SDL_mixer describe --tags --exact-match)" = "${MIXER_REF}"
          test "$(git -C SDL_image describe --tags --exact-match)" = "${IMAGE_REF}"
          test "$(git -C SDL_net describe --tags --exact-match)" = "${NET_REF}"

          git -C SDL rev-parse HEAD
          git -C SDL_ttf rev-parse HEAD
          git -C SDL_mixer rev-parse HEAD
          git -C SDL_image rev-parse HEAD
          git -C SDL_net rev-parse HEAD
          git -C SDL_ttf submodule status --recursive

      - name: Configure SDL2
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          test -f \
            "${NDK_ROOT}/build/cmake/android.toolchain.cmake"

          cmake \
            -S SDL \
            -B build-sdl \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_INSTALL=ON

      - name: Build and install SDL2
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-sdl \
            --parallel 2 \
            --verbose

          cmake \
            --install build-sdl \
            --prefix "${GITHUB_WORKSPACE}/sdl-prefix"

          find "${GITHUB_WORKSPACE}/sdl-prefix" \
            -type f \
            -print

      - name: Configure SDL2_ttf
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          SDL2_CONFIG="$(
            find "${GITHUB_WORKSPACE}/sdl-prefix" \
              -type f \
              -name SDL2Config.cmake \
              -print \
              -quit
          )"

          test -n "${SDL2_CONFIG}"

          SDL2_CONFIG_DIR="$(dirname "${SDL2_CONFIG}")"

          cmake \
            -S SDL_ttf \
            -B build-ttf \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl-prefix" \
            -DSDL2_DIR="${SDL2_CONFIG_DIR}" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL2TTF_VENDORED=ON \
            -DSDL2TTF_HARFBUZZ=OFF \
            -DSDL2TTF_SAMPLES=OFF \
            -DSDL2TTF_INSTALL=OFF

      - name: Build SDL2_ttf
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-ttf \
            --parallel 2 \
            --verbose

      - name: Configure SDL2_mixer
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          SDL2_CONFIG="$(
            find "${GITHUB_WORKSPACE}/sdl-prefix" \
              -type f \
              -name SDL2Config.cmake \
              -print \
              -quit
          )"

          test -n "${SDL2_CONFIG}"

          SDL2_CONFIG_DIR="$(dirname "${SDL2_CONFIG}")"

          cmake \
            -S SDL_mixer \
            -B build-mixer \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl-prefix" \
            -DSDL2_DIR="${SDL2_CONFIG_DIR}" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL2MIXER_VENDORED=ON \
            -DSDL2MIXER_DEPS_SHARED=OFF \
            -DSDL2MIXER_CMD=OFF \
            -DSDL2MIXER_FLAC=OFF \
            -DSDL2MIXER_GME=OFF \
            -DSDL2MIXER_MOD=OFF \
            -DSDL2MIXER_MP3=ON \
            -DSDL2MIXER_MP3_MINIMP3=ON \
            -DSDL2MIXER_MP3_MPG123=OFF \
            -DSDL2MIXER_MIDI=OFF \
            -DSDL2MIXER_OPUS=OFF \
            -DSDL2MIXER_VORBIS=STB \
            -DSDL2MIXER_WAVE=ON \
            -DSDL2MIXER_WAVPACK=OFF \
            -DSDL2MIXER_SAMPLES=OFF \
            -DSDL2MIXER_INSTALL=OFF

      - name: Build SDL2_mixer
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-mixer \
            --parallel 2 \
            --verbose

      - name: Configure SDL2_image
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          SDL2_CONFIG="$(
            find "${GITHUB_WORKSPACE}/sdl-prefix" \
              -type f \
              -name SDL2Config.cmake \
              -print \
              -quit
          )"

          test -n "${SDL2_CONFIG}"

          SDL2_CONFIG_DIR="$(dirname "${SDL2_CONFIG}")"

          cmake \
            -S SDL_image \
            -B build-image \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl-prefix" \
            -DSDL2_DIR="${SDL2_CONFIG_DIR}" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL2IMAGE_VENDORED=ON \
            -DSDL2IMAGE_DEPS_SHARED=OFF \
            -DSDL2IMAGE_STRICT=ON \
            -DSDL2IMAGE_BACKEND_STB=ON \
            -DSDL2IMAGE_AVIF=OFF \
            -DSDL2IMAGE_BMP=ON \
            -DSDL2IMAGE_GIF=OFF \
            -DSDL2IMAGE_JPG=ON \
            -DSDL2IMAGE_JPG_SAVE=OFF \
            -DSDL2IMAGE_JXL=OFF \
            -DSDL2IMAGE_LBM=OFF \
            -DSDL2IMAGE_PCX=OFF \
            -DSDL2IMAGE_PNG=ON \
            -DSDL2IMAGE_PNG_SAVE=OFF \
            -DSDL2IMAGE_PNM=OFF \
            -DSDL2IMAGE_QOI=ON \
            -DSDL2IMAGE_SVG=OFF \
            -DSDL2IMAGE_TGA=OFF \
            -DSDL2IMAGE_TIF=OFF \
            -DSDL2IMAGE_WEBP=OFF \
            -DSDL2IMAGE_XCF=OFF \
            -DSDL2IMAGE_XPM=OFF \
            -DSDL2IMAGE_XV=OFF \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_INSTALL=OFF

      - name: Build SDL2_image
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-image \
            --parallel 2 \
            --verbose

      - name: Configure SDL2_net
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          SDL2_CONFIG="$(
            find "${GITHUB_WORKSPACE}/sdl-prefix" \
              -type f \
              -name SDL2Config.cmake \
              -print \
              -quit
          )"

          test -n "${SDL2_CONFIG}"

          SDL2_CONFIG_DIR="$(dirname "${SDL2_CONFIG}")"

          cmake \
            -S SDL_net \
            -B build-net \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/sdl-prefix" \
            -DSDL2_DIR="${SDL2_CONFIG_DIR}" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL2NET_SAMPLES=OFF \
            -DSDL2NET_INSTALL=OFF

      - name: Build SDL2_net
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build-net \
            --parallel 2 \
            --verbose

      - name: Assemble staged kit
        shell: bash
        run: |
          set -euo pipefail

          SDL_LIBRARY="$(
            find build-sdl \
              -type f \
              -name libSDL2.so \
              -print \
              -quit
          )"

          TTF_LIBRARY="$(
            find build-ttf \
              -type f \
              -name libSDL2_ttf.so \
              -print \
              -quit
          )"

          MIXER_LIBRARY="$(
            find build-mixer \
              -type f \
              -name libSDL2_mixer.so \
              -print \
              -quit
          )"

          IMAGE_LIBRARY="$(
            find build-image \
              -type f \
              -name libSDL2_image.so \
              -print \
              -quit
          )"

          NET_LIBRARY="$(
            find build-net \
              -type f \
              -name libSDL2_net.so \
              -print \
              -quit
          )"

          test -n "${SDL_LIBRARY}"
          test -n "${TTF_LIBRARY}"
          test -n "${MIXER_LIBRARY}"
          test -n "${IMAGE_LIBRARY}"
          test -n "${NET_LIBRARY}"

          STAGE="dist/${OUTPUT_NAME}"

          mkdir -p \
            "${STAGE}/include/SDL2" \
            "${STAGE}/java" \
            "${STAGE}/lib/${ANDROID_ABI}" \
            "${STAGE}/licenses" \
            "${STAGE}/tests/core-capability" \
            "${STAGE}/tests/ttf-capability" \
            "${STAGE}/tests/mixer-capability" \
            "${STAGE}/tests/net-capability"

          cp \
            "${SDL_LIBRARY}" \
            "${STAGE}/lib/${ANDROID_ABI}/libSDL2.so"

          cp \
            "${TTF_LIBRARY}" \
            "${STAGE}/lib/${ANDROID_ABI}/libSDL2_ttf.so"

          cp \
            "${MIXER_LIBRARY}" \
            "${STAGE}/lib/${ANDROID_ABI}/libSDL2_mixer.so"

          cp \
            "${IMAGE_LIBRARY}" \
            "${STAGE}/lib/${ANDROID_ABI}/libSDL2_image.so"

          cp \
            "${NET_LIBRARY}" \
            "${STAGE}/lib/${ANDROID_ABI}/libSDL2_net.so"

          cp SDL/include/*.h \
            "${STAGE}/include/SDL2/"

          cp SDL_ttf/SDL_ttf.h \
            "${STAGE}/include/SDL2/"

          cp SDL_mixer/include/SDL_mixer.h \
            "${STAGE}/include/SDL2/"

          cp SDL_image/include/SDL_image.h \
            "${STAGE}/include/SDL2/"

          cp SDL_net/include/SDL_net.h \
            "${STAGE}/include/SDL2/"

          cp -R \
            SDL/android-project/app/src/main/java/org \
            "${STAGE}/java/"

          cp SDL/LICENSE.txt \
            "${STAGE}/licenses/SDL2-LICENSE.txt"

          cp SDL_ttf/LICENSE.txt \
            "${STAGE}/licenses/SDL2_ttf-LICENSE.txt"

          cp SDL_ttf/external/freetype/LICENSE.TXT \
            "${STAGE}/licenses/FreeType-LICENSE.txt"

          cp SDL_ttf/external/freetype/docs/FTL.TXT \
            "${STAGE}/licenses/FreeType-FTL.txt"

          cp SDL_mixer/LICENSE.txt \
            "${STAGE}/licenses/SDL2_mixer-LICENSE.txt"

          cp SDL_image/LICENSE.txt \
            "${STAGE}/licenses/SDL2_image-LICENSE.txt"

          cp SDL_net/LICENSE.txt \
            "${STAGE}/licenses/SDL2_net-LICENSE.txt"

          cp tests/core-capability/main.cpp \
            "${STAGE}/tests/core-capability/main.cpp"

          cp tests/ttf-capability/main.cpp \
            "${STAGE}/tests/ttf-capability/main.cpp"

          cp -R tests/mixer-capability/. \
            "${STAGE}/tests/mixer-capability/"

          cp -R tests/net-capability/. \
            "${STAGE}/tests/net-capability/"

          {
            echo "SDL_VERSION=${SDL_VERSION}"
            echo "SDL_REF=${SDL_REF}"
            echo "SDL_COMMIT=$(git -C SDL rev-parse HEAD)"
            echo "TTF_VERSION=${TTF_VERSION}"
            echo "TTF_REF=${TTF_REF}"
            echo "TTF_COMMIT=$(git -C SDL_ttf rev-parse HEAD)"
            echo "FREETYPE_COMMIT=$(git -C SDL_ttf/external/freetype rev-parse HEAD)"
            echo "TTF_HARFBUZZ=OFF"
            echo "TTF_VENDORED_FREETYPE=ON"
            echo "MIXER_VERSION=${MIXER_VERSION}"
            echo "MIXER_REF=${MIXER_REF}"
            echo "MIXER_COMMIT=$(git -C SDL_mixer rev-parse HEAD)"
            echo "MIXER_VENDORED=ON"
            echo "MIXER_WAVE=ON"
            echo "MIXER_VORBIS=STB"
            echo "MIXER_MP3=MINIMP3"
            echo "MIXER_FLAC=OFF"
            echo "MIXER_MIDI=OFF"
            echo "MIXER_MOD=OFF"
            echo "MIXER_OPUS=OFF"
            echo "MIXER_WAVPACK=OFF"
            echo "IMAGE_VERSION=${IMAGE_VERSION}"
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "IMAGE_COMMIT=$(git -C SDL_image rev-parse HEAD)"
            echo "IMAGE_BACKEND_STB=ON"
            echo "IMAGE_BMP=ON"
            echo "IMAGE_JPG=ON"
            echo "IMAGE_PNG=ON"
            echo "IMAGE_QOI=ON"
            echo "IMAGE_OTHER_FORMATS=OFF"
            echo "NET_VERSION=${NET_VERSION}"
            echo "NET_REF=${NET_REF}"
            echo "NET_COMMIT=$(git -C SDL_net rev-parse HEAD)"
            echo "NET_TCP=ON"
            echo "NET_UDP=ON"
            echo "NET_IPV4=ON"
            echo "NDK_VERSION=${NDK_VERSION}"
            echo "ANDROID_ABI=${ANDROID_ABI}"
            echo "ANDROID_API=${ANDROID_API}"
            echo "RUNNER_OS=${RUNNER_OS}"
            echo "RUNNER_ARCH=${RUNNER_ARCH}"
            cmake --version | head -n 1
            ninja --version | sed 's/^/NINJA_VERSION=/'
          } > "${STAGE}/BUILD-INFO.txt"

          {
            echo "SDL2 core:"
            echo "- video and rendering"
            echo "- touch and multitouch"
            echo "- audio"
            echo "- text input"
            echo "- Android lifecycle"
            echo
            echo "SDL2_ttf:"
            echo "- TrueType and OpenType rendering"
            echo "- vendored static FreeType"
            echo "- HarfBuzz disabled"
            echo
            echo "SDL2_mixer:"
            echo "- WAV loading and streaming"
            echo "- Ogg Vorbis through the built-in STB decoder"
            echo "- MP3 through the built-in minimp3 decoder"
            echo "- no external codec shared libraries"
            echo "- FLAC, MIDI, MOD, Opus, and WavPack disabled"
            echo
            echo "SDL2_image:"
            echo "- PNG and JPEG through the embedded STB backend"
            echo "- built-in BMP and QOI loading"
            echo "- no external image codec shared libraries"
            echo "- other image formats disabled"
            echo
            echo "SDL2_net:"
            echo "- portable IPv4 TCP client and server sockets"
            echo "- portable IPv4 UDP sockets"
            echo "- hostname resolution and socket polling"
            echo "- no HTTP, TLS, WebSocket, or JSON layer"
          } > "${STAGE}/FEATURES.txt"

      - name: Verify staged libraries
        shell: bash
        run: |
          set -euo pipefail

          STAGE="dist/${OUTPUT_NAME}"
          LIB_DIR="${STAGE}/lib/${ANDROID_ABI}"

          for LIBRARY in \
            "${LIB_DIR}/libSDL2.so" \
            "${LIB_DIR}/libSDL2_ttf.so" \
            "${LIB_DIR}/libSDL2_mixer.so" \
            "${LIB_DIR}/libSDL2_image.so" \
            "${LIB_DIR}/libSDL2_net.so"
          do
            test -f "${LIBRARY}"

            BASE_NAME="$(basename "${LIBRARY}" .so)"

            readelf -h "${LIBRARY}" \
              | tee "${STAGE}/${BASE_NAME}-ELF-HEADER.txt"

            readelf -h "${LIBRARY}" \
              | grep -q 'Machine:.*AArch64'

            readelf -d "${LIBRARY}" \
              | tee "${STAGE}/${BASE_NAME}-ELF-DYNAMIC.txt"
          done

          readelf -d "${LIB_DIR}/libSDL2_ttf.so" \
            | grep -Fq 'Shared library: [libSDL2.so]'

          if readelf -d "${LIB_DIR}/libSDL2_ttf.so" \
            | grep -Fq 'libfreetype.so'
          then
            echo "ERROR: FreeType was not folded into libSDL2_ttf.so" >&2
            exit 1
          fi

          readelf -d "${LIB_DIR}/libSDL2_mixer.so" \
            | grep -Fq 'Shared library: [libSDL2.so]'

          if readelf -d "${LIB_DIR}/libSDL2_mixer.so" \
            | grep -Eq \
              'Shared library: \[lib(mpg123|vorbis|vorbisfile|ogg|xmp|opus|opusfile|wavpack|fluidsynth)\.so'
          then
            echo "ERROR: SDL2_mixer has an external codec dependency" >&2
            exit 1
          fi

          readelf -Ws "${LIB_DIR}/libSDL2_mixer.so" \
            | tee "${STAGE}/libSDL2_mixer-ELF-SYMBOLS.txt"

          grep -Fq \
            'Mix_OpenAudio' \
            "${STAGE}/libSDL2_mixer-ELF-SYMBOLS.txt"

          readelf -d "${LIB_DIR}/libSDL2_image.so" \
            | grep -Fq 'Shared library: [libSDL2.so]'

          if readelf -d "${LIB_DIR}/libSDL2_image.so" \
            | grep -Eq \
              'Shared library: \[lib(png|jpeg|turbojpeg|z|webp|tiff|avif|jxl)\.so'
          then
            echo "ERROR: SDL2_image has an external codec dependency" >&2
            exit 1
          fi

          readelf -Ws "${LIB_DIR}/libSDL2_image.so" \
            | tee "${STAGE}/libSDL2_image-ELF-SYMBOLS.txt"

          grep -Fq \
            'IMG_Load' \
            "${STAGE}/libSDL2_image-ELF-SYMBOLS.txt"

          readelf -d "${LIB_DIR}/libSDL2_net.so" \
            | grep -Fq 'Shared library: [libSDL2.so]'

          readelf -Ws "${LIB_DIR}/libSDL2_net.so" \
            | tee "${STAGE}/libSDL2_net-ELF-SYMBOLS.txt"

          grep -Fq \
            'SDLNet_TCP_OpenClient' \
            "${STAGE}/libSDL2_net-ELF-SYMBOLS.txt"

          grep -Fq \
            'SDLNet_UDP_Open' \
            "${STAGE}/libSDL2_net-ELF-SYMBOLS.txt"

          test -f "${STAGE}/include/SDL2/SDL.h"
          test -f "${STAGE}/include/SDL2/SDL_ttf.h"
          test -f "${STAGE}/include/SDL2/SDL_mixer.h"
          test -f "${STAGE}/include/SDL2/SDL_image.h"
          test -f "${STAGE}/include/SDL2/SDL_net.h"
          test -f "${STAGE}/java/org/libsdl/app/SDLActivity.java"
          test -f "${STAGE}/tests/core-capability/main.cpp"
          test -f "${STAGE}/tests/ttf-capability/main.cpp"
          test -f "${STAGE}/tests/mixer-capability/main.cpp"
          test -f "${STAGE}/tests/mixer-capability/SHA256SUMS.txt"
          test -f "${STAGE}/tests/net-capability/main.cpp"
          test -f "${STAGE}/tests/net-capability/AndroidManifest.xml"
          test -f "${STAGE}/tests/net-capability/CMakeLists.txt"
          test -f "${STAGE}/tests/net-capability/build-native.sh"
          test -f "${STAGE}/tests/net-capability/SHA256SUMS.txt"

          (
            cd "${STAGE}/tests/mixer-capability"
            sha256sum -c SHA256SUMS.txt
          )

          (
            cd "${STAGE}/tests/net-capability"
            sha256sum -c SHA256SUMS.txt
          )

      - name: Create checksummed archive
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            zip -q -r "../${OUTPUT_NAME}.zip" "${OUTPUT_NAME}"
          )

          sha256sum \
            "${OUTPUT_NAME}.zip" \
            > "${OUTPUT_NAME}.zip.sha256"

          sha256sum \
            -c "${OUTPUT_NAME}.zip.sha256"

      - name: Upload verified staged kit
        uses: actions/upload-artifact@v6
        with:
          name: sdl2-kit-android-arm64
          path: |
            ${{ env.OUTPUT_NAME }}.zip
            ${{ env.OUTPUT_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
